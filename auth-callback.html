<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Signing in to Telugu Daily...</title>
    <style>
      body { font-family: sans-serif; text-align: center; padding: 60px 20px; background: #4ECDC4; color: white; }
      h2 { font-size: 24px; margin-bottom: 12px; }
      p { font-size: 14px; opacity: 0.9; line-height: 1.5; }
      a { color: white; font-weight: bold; display: inline-block; margin-top: 12px; padding: 10px 18px; border: 2px solid white; border-radius: 8px; text-decoration: none; }
    </style>
  </head>
  <body>
    <h2>తె Telugu Daily</h2>
    <p>Signing you in... Opening the app automatically.</p>
    <p id="manual" style="display:none">
      If the app did not open, tap below:<br>
      <a id="openLink" href="#">Open Telugu Daily</a>
    </p>

    <script>
      (function () {
        // Supabase redirects here with ?code=... (PKCE) or #access_token=... (implicit)
        var search = window.location.search || '';
        var hash = window.location.hash || '';

        // Build deep link to the app
        var target = 'myapp://auth/callback' + search + hash;

        // Set manual link
        var link = document.getElementById('openLink');
        link.href = target;

        // Attempt 1: Android intent URI (most reliable for custom schemes)
        var intentSearch = search || '';
        var intentUri = 'intent://auth/callback' + intentSearch + hash +
          '#Intent;scheme=myapp;package=com.shankar_bojanki.teluguDaily;end';
        window.location.href = intentUri;

        // Attempt 2 (fallback after 300ms): direct custom scheme
        setTimeout(function () {
          window.location.href = target;
        }, 300);

        // Attempt 3 (fallback after 1.5s): show manual button
        setTimeout(function () {
          document.getElementById('manual').style.display = 'block';
        }, 1500);
      })();
    </script>
  </body>
</html>
