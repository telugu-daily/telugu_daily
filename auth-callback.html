<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Signing in to Telugu Daily...</title>
    <style>
      body { font-family: sans-serif; text-align: center; padding: 60px 20px; background: #4ECDC4; color: white; }
      h2 { font-size: 24px; margin-bottom: 12px; }
      p { font-size: 14px; opacity: 0.9; line-height: 1.5; }
      a { color: white; font-weight: bold; display: inline-block; margin-top: 12px; padding: 10px 18px; border: 2px solid white; border-radius: 8px; text-decoration: none; }
    </style>
  </head>
  <body>
    <h2>తె Telugu Daily</h2>
    <p>Signing you in... Opening the app automatically.</p>
    <p id="manual" style="display:none">
      If the app did not open, tap below:<br>
      <a id="openLink" href="#">Open Telugu Daily</a>
    </p>

    <script>
      (function () {
        var url = new URL(window.location.href);
        // Pull app_redirect from the query (set by the app with the correct deep link scheme)
        var appRedirect = url.searchParams.get('app_redirect');
        url.searchParams.delete('app_redirect');

        var search = url.search || '';        // remaining query params (?code=...)
        var hash = window.location.hash || ''; // hash params (#access_token=...)

        var target;
        if (appRedirect) {
          // Append Supabase's auth params to the app's deep link
          var sep = appRedirect.indexOf('?') === -1 ? '?' : '&';
          var qs = search.replace(/^\?/, '');
          target = appRedirect + (qs ? sep + qs : '') + hash;
        } else {
          // Fallback: use myapp:// scheme
          target = 'myapp://auth/callback' + search + hash;
        }

        // Set manual link
        var link = document.getElementById('openLink');
        link.href = target;

        // Attempt 1: direct redirect
        window.location.href = target;

        // Attempt 2 (fallback after 500ms): Android intent URI
        setTimeout(function () {
          var intentUri = 'intent://auth/callback' + search + hash +
            '#Intent;scheme=myapp;package=com.shankar_bojanki.teluguDaily;end';
          window.location.href = intentUri;
        }, 500);

        // Attempt 3 (fallback after 1.5s): show manual button
        setTimeout(function () {
          document.getElementById('manual').style.display = 'block';
        }, 1500);
      })();
    </script>
  </body>
</html>
