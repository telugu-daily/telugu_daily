<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Auth callback</title>
    <style>
      body { font-family: Arial, Helvetica, sans-serif; padding: 24px; color:#222; text-align:center }
      a.button { display:inline-block; padding:12px 20px; background:#4ECDC4; color:#fff; border-radius:8px; text-decoration:none; margin-top:16px }
    </style>
  </head>
  <body>
    <h3>Signing you in…</h3>
    <p>Redirecting back to the app.</p>
    <p id="manual"></p>

    <script>
      (function(){
        // Google OAuth sends the authorization code as a query parameter (?code=...&state=...)
        var params = new URLSearchParams(window.location.search);
        var code = params.get('code') || '';
        var stateRaw = params.get('state') || '';

        // Decode return URI from state (set by the app to support Expo Go and standalone)
        var returnUri = 'myapp://auth/callback'; // default fallback
        try {
          if (stateRaw) {
            var stateObj = JSON.parse(atob(stateRaw));
            if (stateObj.returnUri) returnUri = stateObj.returnUri;
          }
        } catch(e) { /* use default */ }

        // Build deep link with code param
        var separator = returnUri.indexOf('?') >= 0 ? '&' : '?';
        var deepLink = returnUri + separator + 'code=' + encodeURIComponent(code);

        // Attempt 1: direct redirect to the app's scheme
        window.location.replace(deepLink);

        // Attempt 2 (fallback after 500ms): Android intent URI for standalone builds
        setTimeout(function(){
          var intentUri = 'intent://auth/callback?code=' + encodeURIComponent(code) +
            '#Intent;scheme=myapp;package=com.shankar_bojanki.teluguDaily;end';
          window.location.replace(intentUri);
        }, 500);

        // Attempt 3 (fallback after 2s): show manual button
        setTimeout(function(){
          var p = document.getElementById('manual');
          p.innerHTML = '<p style="color:#666">If the app did not open automatically:</p>' +
                        '<a class="button" href="' + deepLink + '">Open Telugu Daily</a>';
        }, 2000);
      })();
    </script>
  </body>
</html>
